name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site from canonical engine + data
        run: node build.mjs
      - name: Syntax-check generated page
        run: node -e "const h=require('fs').readFileSync('public/index.html','utf8');const m=h.match(/<script>([\s\S]*)<\/script>/);require('fs').writeFileSync('/tmp/b.js',m[1]);" && node --check /tmp/b.js
      - name: Engine regression test
        run: node tests/engine.test.mjs
      - name: Behavior regression test
        run: node tests/behavior.test.mjs
      - name: Validate crest manifest
        run: node scripts/validate-crests.mjs
