name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine regression test
        run: node tests/engine.test.mjs
      - name: Validate crest manifest
        run: node scripts/validate-crests.mjs
