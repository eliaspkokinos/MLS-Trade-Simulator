# MLS Trade Simulator — Netlify serves the pre-built public/index.html directly (no build step).
# public/index.html is a build artifact generated by build.mjs from engine/engine.mjs +
# data/current-state.json and committed to the repo. CI fails if it drifts from a fresh build,
# so the committed file is always in sync with the canonical engine + dataset.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
