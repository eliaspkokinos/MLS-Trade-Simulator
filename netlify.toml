# MLS Trade Simulator — deploy builds public/index.html from canonical sources.
# build.mjs injects engine/engine.mjs + data/current-state.json into src/index.template.html,
# so the deployed engine and dataset are never hand-synced.
[build]
  publish = "public"
  command = "node build.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
