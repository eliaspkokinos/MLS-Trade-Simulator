<title>MLS Roster & Trade Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{

}
*{box-sizing:border-box} html,body{margin:0} html{scroll-padding-top:64px}
body{background:var(--page);color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-feature-settings:"tnum" 1;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.tnum{font-variant-numeric:tabular-nums} button{font-family:inherit}
input[type=text],select{background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%2366707E' fill='none' stroke-width='1.4'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;cursor:pointer}
/* crest */
.crest{position:relative;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:-.02em;overflow:hidden;vertical-align:middle}

.crest.lg{width:46px;height:46px;font-size:14px;border-radius:9px} .crest.md{width:34px;height:34px;font-size:12px} .crest.sm{width:26px;height:26px;font-size:9px;border-radius:6px} .crest.xs{width:22px;height:22px;font-size:8px;border-radius:5px}
/* nav */
.topnav{background:var(--card);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;gap:28px;padding:0 26px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#12275E,#3A4E86);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px}
.brandtxt{font-weight:650;font-size:15px;letter-spacing:-.01em}
.topnav-links{display:flex;gap:2px;height:100%;align-items:stretch}
.topnav-links a{display:flex;align-items:center;padding:0 15px;font-size:13.5px;font-weight:550;color:var(--dim);text-decoration:none;border-bottom:2.5px solid transparent;cursor:pointer}
.topnav-links a:hover{color:var(--ink)} .topnav-links a.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.topnav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--page);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;width:260px;position:relative;color:var(--dimmer)}.search-results{position:absolute;top:calc(100% + 7px);left:0;right:0;background:var(--card);border:1px solid var(--line2);border-radius:10px;box-shadow:0 14px 40px rgba(20,30,50,.16);overflow-y:auto;max-height:364px;z-index:60}.sr-row{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:13px;border-top:1px solid var(--line)}.sr-row:first-child{border-top:0}.sr-row:hover{background:var(--page)}.sr-type{flex-shrink:0;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 5px;border-radius:4px}.sr-player{background:var(--intl-bg);color:var(--intl)}.sr-team{background:var(--accent-soft);color:var(--accent-ink)}.sr-rule{background:var(--hg-bg);color:var(--hg)}.sr-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}.sr-sub{color:var(--dim);font-size:11px;flex-shrink:0}.sr-empty{padding:11px 12px;color:var(--dimmer);font-size:13px}
.search input{border:0;background:transparent;outline:none;font-size:13px;color:var(--ink);width:100%}
.avatar{width:30px;height:30px;border-radius:50%;background:#5B6B8C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:650;font-size:13px}
.main{max-width:1320px;margin:0 auto;padding:26px 30px 90px}
.main-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:4px}
.main-head h2{font-size:27px;font-weight:750;margin:0;letter-spacing:-.02em}
.main-head p.subt{color:var(--dim);margin:6px 0 0;font-size:14px}
.prov{color:var(--dimmer);font-size:12px;margin:8px 0 0;font-variant-numeric:tabular-nums}
.head-actions{display:flex;gap:9px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:13px;font-weight:600;border-radius:9px;padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--dim)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{filter:brightness(1.05)} .btn:disabled{opacity:.5;cursor:default} .btn.sm{font-size:12px;padding:7px 11px}

.tag.dp{background:var(--dp-bg);color:var(--dp);border-color:#EAD79A} .tag.u22{background:var(--u22-bg);color:var(--u22);border-color:#AEDCC2}
.tag.tam{background:var(--tam-bg);color:var(--tam);border-color:#EEC3A6} .tag.intl{background:var(--intl-bg);color:var(--intl);border-color:#B6CFF2}
.tag.hg{background:var(--hg-bg);color:var(--hg);border-color:#CFD6DE} .tag.ga{background:var(--ga-bg);color:var(--ga);border-color:#D6C2EC} .tag.un{background:var(--un-bg);color:var(--un);border-color:#EFC0BB}

.drawer{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:16px 18px;margin-top:14px;box-shadow:0 8px 26px rgba(20,30,50,.07)}
.drawer h4{margin:0 0 4px;font-size:13.5px;font-weight:650} .drawer .hint{color:var(--dim);font-size:12px;margin:0 0 12px;max-width:760px}
.scset{display:flex;flex-direction:column;gap:10px}
.scset .clubrow{display:flex;align-items:center;gap:12px;font-size:13px}
.scset .clubrow .cn{flex:1;font-weight:550;min-width:0;display:flex;align-items:center;gap:9px}
.scset .cnt{display:flex;align-items:center;gap:6px} .scset .cnt label{color:var(--dim);font-size:12px} .scset select{border:1px solid var(--line2);border-radius:7px;padding:6px 26px 6px 9px;font-size:12.5px;min-width:82px}
/* builder */
.builder{display:grid;grid-template-columns:1fr 104px 1fr;gap:0;align-items:stretch;margin-top:22px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.tcard-head{display:flex;align-items:center;gap:13px}
.teamsel{flex:1;min-width:0;font-size:17px;font-weight:700;color:var(--ink);border:1px solid var(--card);background:transparent;border-radius:8px;padding:6px 26px 6px 4px;letter-spacing:-.01em;background-position:right 4px center}
.teamsel:hover{border-color:var(--line2)} .teamsel:focus{outline:2px solid var(--accent);outline-offset:1px}
.sendlab{font-size:13px;font-weight:650;color:var(--ink);margin:18px 0 9px} .sendlab .send-word{color:var(--dim);font-weight:500}
.dd{position:relative}
.ddfield{border:1px solid var(--line2);border-radius:10px;padding:9px 11px;min-height:44px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;cursor:pointer;background:var(--card)}
.ddfield:hover{border-color:var(--dim)} .ddfield .ph{color:var(--dimmer);font-size:13.5px} .ddfield .chev{margin-left:auto;color:var(--dimmer);font-size:11px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--page);border:1px solid var(--line2);border-radius:9px;padding:5px 7px 5px 10px;font-size:13px;font-weight:550}
.pill .rm{border:0;background:transparent;color:var(--dimmer);cursor:pointer;font-size:16px;padding:0 3px;border-radius:5px;line-height:1} .pill .rm:hover{color:var(--bad);background:var(--bad-soft)}
.pill.slot .stp,.pill.gam .x{display:flex;align-items:center;gap:3px}
.pill.slot .stp button{width:20px;height:20px;border:1px solid var(--line2);background:var(--card);border-radius:5px;cursor:pointer;color:var(--dim);font-size:12px;line-height:1}
.ddpanel{position:absolute;z-index:50;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line2);border-radius:11px;box-shadow:0 14px 40px rgba(20,30,50,.15);overflow:hidden}
.ddpanel .search2{width:100%;border:0;border-bottom:1px solid var(--line);padding:11px 13px;font-size:13.5px;outline:none}
.ddlist{max-height:290px;overflow-y:auto}
.ddgroup{font-size:10px;letter-spacing:.05em;color:var(--dimmer);padding:9px 13px 4px;text-transform:uppercase;font-weight:600}
.ddrow{display:flex;align-items:center;gap:9px;padding:8px 13px;cursor:pointer} .ddrow:hover{background:var(--page)}
.ddrow .nm{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .ddrow .nm .meta{color:var(--dim);font-size:11.5px;margin-left:5px}
.ddrow .sal{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums} .ddrow.opt{color:var(--accent-ink);font-weight:600}
.gamrow{margin-top:16px} .gamlab{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:8px}
.gaminput{display:flex;align-items:center;gap:10px} .gaminput input{width:150px;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:14px;font-variant-numeric:tabular-nums} .gaminput input:focus{outline:2px solid var(--accent);outline-offset:1px}
.stepbtns{display:flex} .stepbtns button{width:34px;height:38px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-size:16px;color:var(--dim)}
.stepbtns button:first-child{border-radius:9px 0 0 9px} .stepbtns button:last-child{border-radius:0 9px 9px 0;border-left:0} .stepbtns button:hover{background:var(--page)}
.gamval{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums;font-size:15px}
.swapcol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px} .swapcircle{width:50px;height:50px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:19px} .swaplab{font-size:12px;font-weight:600;color:var(--dim)}
/* checks */
.checks{margin-top:30px} .checks-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.checks-h h3{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em} .checks-h .subt{color:var(--dim);font-size:13px;margin:4px 0 0} .checks-h .rmeta{color:var(--dimmer);font-size:11.5px;text-align:right}
.ctables{display:grid;grid-template-columns:1fr 1fr;gap:18px} .ctable{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ct-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)} .ct-head .cn{font-weight:650;font-size:15px} .ct-head .cs{font-size:12px;color:var(--dim);margin-top:1px}
.ct-head .pill-st{margin-left:auto;font-size:12px;font-weight:650;padding:5px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px} .pill-st.ok{background:var(--ok-soft);color:var(--ok)} .pill-st.bad{background:var(--bad-soft);color:var(--bad)}
table{width:100%;border-collapse:collapse} th{text-align:left;font-size:11px;letter-spacing:.02em;color:var(--dim);font-weight:600;padding:12px 18px 8px} th.num,td.num{text-align:right}
td{padding:11px 18px;font-size:13.5px;border-top:1px solid var(--line)} tr.viol{background:var(--bad-soft)} tr.viol td.rule{color:var(--bad);font-weight:600}
td.delta .to{font-weight:700} td.delta.up .to{color:var(--intl)} td.delta.viol .to{color:var(--bad)} td.delta.same{color:var(--dimmer)} td.lim{color:var(--dimmer)}
.rowst{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550} .rowst.ok{color:var(--ok)} .rowst.bad{color:var(--bad)} .rowst.na{color:var(--dimmer);font-weight:400}
.ic-check,.ic-x{width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800} .ic-check{background:var(--ok)} .ic-x{background:var(--bad)}
/* banner */
.banner{margin-top:20px;border-radius:14px;padding:18px 20px;display:flex;align-items:flex-start;gap:16px}
.banner.blocked{background:var(--bad-soft);border:1px solid var(--bad-line)} .banner.legal{background:var(--ok-soft);border:1px solid var(--ok-line)} .banner.unverified{background:var(--warn-soft);border:1px solid var(--warn-line)} .banner.idle{background:var(--card);border:1px solid var(--line)}
.bicon{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:800;margin-top:1px}
.banner.blocked .bicon{background:var(--bad)} .banner.legal .bicon{background:var(--ok)} .banner.unverified .bicon{background:var(--warn)} .banner.idle .bicon{background:var(--line2);color:var(--dim)}
.bmain{flex:1;min-width:0} .beyebrow{font-size:11px;letter-spacing:.05em;font-weight:700;text-transform:uppercase;margin-bottom:3px}
.banner.blocked .beyebrow{color:var(--bad)} .banner.legal .beyebrow{color:var(--ok)} .banner.unverified .beyebrow{color:var(--warn)}
.btitle{font-size:17px;font-weight:700;letter-spacing:-.01em} .bsub{color:var(--dim);font-size:13px;margin-top:3px}
details.more{margin-top:9px} details.more summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--dim);list-style:none;display:inline-flex;align-items:center;gap:5px}
details.more summary::-webkit-details-marker{display:none} details.more summary::after{content:"›";transition:transform .15s} details.more[open] summary::after{transform:rotate(90deg)}
details.more .items{margin-top:8px;display:flex;flex-direction:column;gap:5px} .ditem{font-size:12.5px;color:var(--ink);padding-left:14px;position:relative;line-height:1.45} .ditem::before{content:"·";position:absolute;left:2px;color:var(--dimmer);font-weight:700} .ditem.blk::before{content:"×";color:var(--bad)} .ditem .who{color:var(--dim)}
.bactions{display:flex;gap:10px;flex-shrink:0;align-self:center}
/* rosters view */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0 22px;background:var(--card)}
.strip .cell{padding:14px 16px;border-right:1px solid var(--line)} .strip .cell:last-child{border-right:0}
.strip .lab{font-size:11px;color:var(--dim);font-weight:600;margin-bottom:5px} .strip .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums} .strip .val .max{color:var(--dimmer);font-weight:400;font-size:15px}
.strip .cell.over .val{color:var(--bad)} .strip .cell.tight .val{color:var(--warn)}
.rtable{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rtable td .pn{font-weight:550} .rtable td.meta{color:var(--dim)}
/* scenarios view */
.scards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.scard h3{margin:0 0 3px;font-size:16px;font-weight:700} .scard .sc-sub{color:var(--dim);font-size:12.5px;margin-bottom:12px}
.savedrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.savedrow .sn{flex:1;font-weight:550} .savedrow .sm{color:var(--dimmer);font-size:11.5px}
.saverow{display:flex;gap:8px;margin-top:12px} .saverow input{flex:1;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px}
/* rules view */
.rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.rblock{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.rblock h3{margin:0 0 12px;font-size:15px;font-weight:700} .rblock .rr{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-top:1px solid var(--line);font-size:13px} .rblock .rr:first-of-type{border-top:0} .rblock .rr .k{color:var(--dim)} .rblock .rr .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right} .rblock p{color:var(--dim);font-size:12.5px;line-height:1.6;margin:0 0 10px}
.foot{margin-top:26px;color:var(--dim);font-size:12px;line-height:1.55;max-width:1000px} .foot details summary{cursor:pointer;color:var(--accent-ink);font-weight:600;font-size:12px;margin-top:6px} .foot .detail{color:var(--dimmer);font-size:11.5px;margin-top:8px;line-height:1.65}
@media (max-width:860px){ .builder{grid-template-columns:1fr} .swapcol{flex-direction:row;padding:10px 0} .ctables,.scards,.rules-grid{grid-template-columns:1fr} .topnav-links{display:none} .search{width:140px} .strip{grid-template-columns:repeat(2,1fr)} }
</style></head><body>
<header class="topnav">
  <div class="brand"><div class="mark">MLS</div><span class="brandtxt">Roster &amp; Trade Console</span></div>
  <nav class="topnav-links">
    <a data-view="trade" class="active">Trade Analyzer</a><a data-view="rosters">Rosters</a><a data-view="scenarios">Scenarios</a><a data-view="rules">Rules &amp; Resources</a>
  </nav>
  <div class="topnav-right"><div class="search">&#128269;<input placeholder="Search players, teams, or rules..." id="globalsearch" autocomplete="off"><div id="searchResults" class="search-results" hidden></div></div><span id="vintage" title="Date through which real-world transactions have been applied" style="font-size:11.5px;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap"></span><div class="avatar">J</div></div>
</header>
<main class="main" id="viewroot"></main>
<script>
const DATA_BASE = /*__DATA__*/null;
/* ============================================================================
   CENTRALIZED CLUB CONFIG — the ONE place to manage crests.
   Populate crestUrl for each club with a remotely hosted HTTPS image URL, once.
   Every crest in the app renders via ClubCrest(), which uses a plain <img> so any
   ordinary HTTPS URL works on Netlify/Vercel with no domain allowlisting. If the
   image is missing or fails to load, the colored initials badge shows automatically.
   Club NAME is the source of truth for all roster logic; the crest is presentation only.
   Optional build-time caching: a deploy script can read CLUBS[].crestUrl, download each
   into /public/crests/<id>.png, and rewrite crestUrl to that local path — no per-club

    for(const t of teams){ const tc=scenario.tradeCounts[t]||{dpTradesUsed:null,u22TradesUsed:null}; const opt=(v,sel)=>'<option value="'+v+'"'+(String(sel)===String(v)?' selected':'')+'>'+(v===""?"unknown":v+"/1")+'</option>';
      rows+='<div class="clubrow"><span class="cn">'+ClubCrest(t,"sm")+t+'</span><span class="cnt"><label>DP trades</label><select data-tc="'+t+'" data-kind="dp">'+opt("",tc.dpTradesUsed)+opt(0,tc.dpTradesUsed)+opt(1,tc.dpTradesUsed)+'</select></span><span class="cnt"><label>U22 trades</label><select data-tc="'+t+'" data-kind="u22">'+opt("",tc.u22TradesUsed)+opt(0,tc.u22TradesUsed)+opt(1,tc.u22TradesUsed)+'</select></span></div>'; }
    sd.innerHTML='<div class="drawer"><h4>Scenario settings — annual trade usage</h4><p class="hint">MLS allows one DP and one U22 trade per club per year. Public data doesn\'t show usage, so it stays "unknown" (amber) until set. Committed DP/U22 trades update it automatically.</p><div class="scset">'+rows+'</div></div>';
  } else sd.innerHTML="";
  if(openDrawer==="history"){ const h=scenario.history||[]; let items=""; if(!h.length) items='<div style="color:var(--dimmer);font-size:12.5px;padding:6px 0">No committed moves yet.</div>';
    else h.forEach((x,i)=>{ const d=x.deal; items+='<div style="display:flex;gap:9px;font-size:12.5px;padding:8px 0;border-top:1px solid var(--line)"><span style="color:var(--dimmer);width:16px">'+(i+1)+'</span>'+d.teamA.split(" ").slice(-1)+' &#8644; '+d.teamB.split(" ").slice(-1)+' ('+d.aSends.players.length+'&#8644;'+d.bSends.players.length+' players'+((d.aSends.gam||d.bSends.gam)?", GAM":"")+((d.aSends.intlSlots||d.bSends.intlSlots)?", slot":"")+')'+(x.resultStatus==="unverified"?' <span style="color:var(--warn)">· unverified</span>':'')+'</div>'; });
    hd.innerHTML='<div class="drawer"><h4>Scenario history</h4>'+items+'<div style="display:flex;gap:9px;margin-top:12px"><button class="btn sm" data-undo="1"'+(h.length?"":" disabled")+'>Undo last</button><button class="btn sm" data-reset="1"'+(h.length?"":" disabled")+' style="color:var(--bad)">Reset to published</button><button class="btn sm" data-goscenarios="1">Manage scenarios &rarr;</button></div></div>';
  } else hd.innerHTML="";
}

/* ===== ROSTERS VIEW ===== */
function rostersView(){ const s=rosterState(rostersTeam,scenario); const roster=scenario.players.filter(p=>p.team===rostersTeam).slice().sort((a,b)=>(b.salary_guar||0)-(a.salary_guar||0));
  const cell=(lab,cur,max)=>{ const cls=cur>max?"over":cur>=max?"tight":""; return '<div class="cell '+cls+'"><div class="lab">'+lab+'</div><div class="val tnum">'+cur+'<span class="max">/'+max+'</span></div></div>'; };
  let rows=""; for(const p of roster){ rows+='<tr><td><span class="pn">'+p.name+'</span></td><td class="meta">'+(p.position||"—")+'</td><td class="meta tnum">'+(p.age||"—")+'</td><td>'+idBadges(p,true)+'</td><td class="num tnum">'+fmtK(p.salary_guar)+'</td><td class="meta">'+(isUnavailable(p)?p.status:"Active")+'</td></tr>'; }
  return '<div class="main-head"><div><h2>Rosters</h2><p class="subt">Live roster and constraint profile for each club, reflecting any committed scenario moves.</p></div>'+
    '<div class="head-actions"><select class="btn" data-rteam style="font-weight:600">'+TEAMS.map(t=>'<option'+(t===rostersTeam?' selected':'')+'>'+t+'</option>').join('')+'</select></div></div>'+
    '<div style="display:flex;align-items:center;gap:13px;margin-top:16px">'+ClubCrest(rostersTeam,"lg")+'<div><div style="font-size:19px;font-weight:700">'+rostersTeam+'</div><div style="color:var(--dim);font-size:12.5px">'+(scenario.clubs[rostersTeam].model==="U22"?"U22 Initiative model · 2 DP / 4 U22":"Designated Player model · 3 DP / 3 U22")+'</div></div></div>'+
    '<div class="strip">'+cell("Designated Players",s.dpCount,s.dpMax)+cell("U22 Initiative",s.u22Count,s.u22Max)+cell("Internationals",s.intlEffective,s.intlOwned)+cell("Senior roster",s.seniorCount,s.seniorMax)+'<div class="cell"><div class="lab">GAM available</div><div class="val tnum" style="font-size:17px">'+fmtK(s.gam)+'</div></div></div>'+
    '<div class="rtable"><table><thead><tr><th>Player</th><th>Pos</th><th class="num">Age</th><th>Categories</th><th class="num">Guaranteed comp</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="foot">Categories reflect each player\'s roster designation at this club. Comp is Apr 2026 MLSPA guaranteed compensation; a dash means no April figure (a post-window arrival awaiting the next release). Salary Budget treatment is modeled, not the club\'s exact private accounting.</div>'; }

/* ===== SCENARIOS VIEW ===== */
function scenariosView(){ const h=scenario.history||[]; const saved=loadSaved();
  let hist=""; if(!h.length) hist='<div style="color:var(--dimmer);font-size:13px;padding:8px 0">No committed moves in the working scenario. Build trades in the Trade Analyzer and commit them here.</div>';
  else h.forEach((x,i)=>{ const d=x.deal; hist+='<div class="savedrow"><span style="color:var(--dimmer);width:18px" class="tnum">'+(i+1)+'</span><span class="sn">'+d.teamA.split(" ").slice(-1)+' &#8644; '+d.teamB.split(" ").slice(-1)+' <span class="sm">'+d.aSends.players.length+'&#8644;'+d.bSends.players.length+' players'+((d.aSends.gam||d.bSends.gam)?", GAM":"")+((d.aSends.intlSlots||d.bSends.intlSlots)?", slot":"")+'</span></span>'+(x.resultStatus==="unverified"?'<span class="tag u22" style="background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)">unverified</span>':'')+'</div>'; });
  let savedList=""; if(!saved.length) savedList='<div style="color:var(--dimmer);font-size:13px;padding:8px 0">No saved scenarios yet. Save the working scenario to return to it later.</div>';
  else saved.forEach((s,i)=>{ const dt=new Date(s.savedAt); savedList+='<div class="savedrow"><span class="sn">'+(s.name||"Untitled")+' <span class="sm">'+(s.deals?s.deals.length:0)+' move'+((s.deals&&s.deals.length!==1)?"s":"")+' · '+dt.toLocaleDateString()+'</span></span><button class="btn sm" data-loadsc="'+i+'">Load</button><button class="btn sm" data-forksc="'+i+'">Duplicate</button><button class="btn sm" data-delsc="'+i+'" style="color:var(--bad)">Delete</button></div>'; });
  return '<div class="main-head"><div><h2>Scenarios</h2><p class="subt">Plan a full window: chain trades, save named plans, branch alternatives, and return to them later.</p>'+
    '<p class="prov">Working scenario built from the Sep 15, 2026 published rosters · '+h.length+' committed move'+(h.length!==1?"s":"")+'</p></div></div>'+
    '<div class="scards"><div class="scard"><h3>Working scenario</h3><div class="sc-sub">The live state every trade evaluates against.</div>'+hist+
      '<div style="display:flex;gap:9px;margin-top:14px;flex-wrap:wrap"><button class="btn sm" data-gotrade="1">&#8644; Build a trade</button><button class="btn sm" data-undo="1"'+(h.length?"":" disabled")+'>Undo last</button><button class="btn sm" data-reset="1"'+(h.length?"":" disabled")+' style="color:var(--bad)">Reset to published</button></div>'+
      '<div class="saverow"><input type="text" id="scname" placeholder="Name this scenario…"><button class="btn primary sm" data-savesc="1">Save</button></div></div>'+
    '<div class="scard"><h3>Saved scenarios</h3><div class="sc-sub">Stored in this browser. Load to make one the working scenario; duplicate to branch a variant.</div>'+savedList+'</div></div>'+
    '<div class="foot">Saved scenarios live in this browser\'s local storage (private to you, this device). Each stores the sequence of committed moves and replays them onto the published rosters, so they stay valid against the same Sep 15 2026 snapshot.</div>'; }

/* ===== RULES VIEW ===== */
function rulesView(){ const C=DATA_BASE.meta.constants; const rr=(k,v)=>'<div class="rr"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';
  return '<div class="main-head"><div><h2>Rules &amp; Resources</h2><p class="subt">The 2026 MLS roster ruleset this console models. Reference values, not legal advice.</p></div></div>'+
    '<div class="rules-grid" style="margin-top:18px">'+
    '<div class="rblock"><h3>Salary Budget &amp; charges (2026)</h3>'+rr("Club Salary Budget",fmtExact(C.salary_budget))+rr("Maximum Salary Budget Charge",fmtExact(C.max_budget_charge))+rr("Senior minimum salary",fmtExact(C.senior_min))+rr("Reserve minimum salary",fmtExact(C.reserve_min))+rr("TAM ceiling (max charge to buy down)",fmtExact(C.tam_ceiling))+rr("GAM buy-down floor","$150,000 or 50% of charge")+'</div>'+
    '<div class="rblock"><h3>Roster construction models</h3><p>Each club declares one model per season.</p>'+rr("Designated Player model","3 DP + 3 U22")+rr("U22 Initiative model","2 DP + 4 U22 (+$2M GAM)")+rr("Senior roster","20 slots (budget)")+rr("Supplemental roster","slots 21–31")+rr("International slots","8 base, tradable")+rr("Canadian club exemption","+3 international")+'</div>'+
    '<div class="rblock"><h3>Designated Player charges by age</h3><p>League-year age (year, not date, of birth).</p>'+rr("DP, 24 and older",fmtExact(C.max_budget_charge))+rr("Young DP, 21–23",fmtExact(C.ydp_21_23_charge))+rr("Young DP, 20 and under",fmtExact(C.ydp_20_charge))+rr("Mid-season DP (post-window)",fmtExact(C.mid_season_dp_charge))+rr("U22 slot, 21–25",fmtExact(C.u22_21_25_charge))+rr("U22 slot, 20 and under",fmtExact(C.u22_20_charge))+'</div>'+
    '<div class="rblock"><h3>Trades &amp; windows</h3>'+rr("DP trades per club / year","1 (2 active max)")+rr("U22 trades per club / year","1 (2 active max)")+rr("Trade eligibility","2nd MLS season onward")+rr("TAM tradable?","No")+rr("GAM tradable?","Yes")+rr("International slots tradable?","Yes")+rr("Roster Freeze","Oct 9, 2026")+'<p style="margin-top:12px">Player-trade windows: Primary Jan 26 – Mar 26; Secondary Jul 13 – Sep 2. Both closed as of the Sep 15 snapshot; this models the next window.</p></div>'+
    '</div>'+
    '<div class="foot">Sourced from the MLS 2026 Roster Rules &amp; Regulations. This console verifies the constraints computable from public data and flags what it can\'t (exact per-player TAM/GAM buy-downs and annual trade usage are not public).</div>'; }

/* ---------- events ---------- */
function resetProposal(){ st.A.players.clear(); st.B.players.clear(); st.A.gam=st.B.gam=0; st.A.slots=st.B.slots=0; openDD=null; ddSearch=""; }
document.addEventListener("click",e=>{ const t=e.target;
  const nv=t.closest("[data-view]"); if(nv){ view=nv.dataset.view; openDD=null; openDrawer=null; render(); window.scrollTo(0,0); return; }
  const gt=t.closest("[data-gotrade]"); if(gt){ view="trade"; render(); window.scrollTo(0,0); return; }
  const gs=t.closest("[data-goscenarios]"); if(gs){ view="scenarios"; render(); window.scrollTo(0,0); return; }
  // specific pill controls FIRST (they live inside data-open) — fixes the X button
  const rp=t.closest("[data-rm-player]"); if(rp){ st[rp.dataset.rmPlayer].players.delete(decodeURIComponent(rp.dataset.nm)); render(); return; }
  const rss=t.closest("[data-rmslot]"); if(rss){ st[rss.dataset.rmslot].slots=0; render(); return; }
  const rg=t.closest("[data-rmgam]"); if(rg){ st[rg.dataset.rmgam].gam=0; render(); return; }
  const slt=t.closest("[data-slot]"); if(slt){ const k=slt.dataset.slot; st[k].slots=Math.max(0,st[k].slots+parseInt(slt.dataset.d)); render(); return; }
  const gst=t.closest("[data-gamstep]"); if(gst){ const k=gst.dataset.gamstep; st[k].gam=Math.max(0,st[k].gam+parseInt(gst.dataset.d)); render(); return; }
  const tg=t.closest("[data-toggle]"); if(tg){ const d=tg.dataset.toggle; openDrawer=(openDrawer===d?null:d); render(); return; }
  const op=t.closest("[data-open]"); if(op){ const k=op.dataset.open; openDD=(openDD===k?null:k); ddSearch=""; render(); return; }
  const ap=t.closest("[data-add-player]"); if(ap){ st[ap.dataset.addPlayer].players.add(decodeURIComponent(ap.dataset.nm)); openDD=null; ddSearch=""; render(); return; }
  const as=t.closest("[data-add-slot]"); if(as){ const k=as.dataset.addSlot; st[k].slots=Math.max(1,st[k].slots||1); openDD=null; ddSearch=""; render(); return; }
  const ag=t.closest("[data-add-gam]"); if(ag){ const k=ag.dataset.addGam; openDD=null; ddSearch=""; render(); const i=document.querySelector('input[data-gam="'+k+'"]'); if(i)i.focus(); return; }
  const rm=t.closest("[data-remedy]"); if(rm){ st[rm.dataset.remedy].slots=(st[rm.dataset.remedy].slots||0)+1; render(); return; }
  const cm=t.closest("[data-commit]"); if(cm && !cm.disabled){ const out=applyTrade(scenario,deal(),{force:true}); if(out.ok){ undoStack.push(scenario); scenario=out.scenario; resetProposal(); render(); } return; }
  const ed=t.closest("[data-edit]"); if(ed){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  const un=t.closest("[data-undo]"); if(un&&!un.disabled&&undoStack.length){ scenario=undoStack.pop(); resetProposal(); render(); return; }
  const re=t.closest("[data-reset]"); if(re&&!re.disabled){ scenario=newScenario(DATA_BASE); undoStack=[]; resetProposal(); openDrawer=null; render(); return; }
  const sv=t.closest("[data-savesc]"); if(sv){ const inp=document.getElementById("scname"); const nm=(inp&&inp.value.trim())||("Scenario "+(loadSaved().length+1)); const arr=loadSaved(); arr.unshift(serialize(nm)); if(!persistSaved(arr)) alert("Could not save — browser storage may be full."); render(); return; }
  const ld=t.closest("[data-loadsc]"); if(ld){ const s=loadSaved()[+ld.dataset.loadsc]; if(s){ scenario=rebuild(s); undoStack=[]; resetProposal(); render(); } return; }
  const fk=t.closest("[data-forksc]"); if(fk){ const s=loadSaved()[+fk.dataset.forksc]; if(s){ const arr=loadSaved(); arr.unshift({...s, name:(s.name||"Scenario")+" (copy)", savedAt:Date.now()}); persistSaved(arr); render(); } return; }
  const dl=t.closest("[data-delsc]"); if(dl){ const arr=loadSaved(); arr.splice(+dl.dataset.delsc,1); persistSaved(arr); render(); return; }
  if(openDD && !t.closest(".dd")){ openDD=null; ddSearch=""; render(); }
});
document.addEventListener("input",e=>{
  const s=e.target.closest("[data-search]"); if(s){ ddSearch=s.value; const k=s.dataset.search; render(); const i=document.querySelector('input[data-search="'+k+'"]'); if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);} return; }
  const g=e.target.closest("[data-gam]"); if(g){ const k=g.dataset.gam; st[k].gam=parseInt(g.value.replace(/[^0-9]/g,""))||0; const r=evaluate(); renderCard(k==="A"?"B":"A",r); renderChecks(r); renderBanner(r); const gv=document.querySelector('#card'+k+' .gamval'); if(gv)gv.textContent=fmtK(st[k].gam); const sb=document.getElementById("savebtn"); if(sb)sb.disabled=!(r&&r.status!=="blocked"); return; }
});
document.addEventListener("change",e=>{
  const tm=e.target.closest("[data-team]"); if(tm){ const k=tm.dataset.team; if(scenario.clubs[tm.value]){ st[k].team=tm.value; resetProposal(); } render(); return; }
  const rt=e.target.closest("[data-rteam]"); if(rt){ rostersTeam=rt.value; render(); return; }
  const tc=e.target.closest("[data-tc]"); if(tc){ const team=tc.dataset.tc,kind=tc.dataset.kind,v=tc.value===""?null:parseInt(tc.value); if(!scenario.tradeCounts[team])scenario.tradeCounts[team]={dpTradesUsed:null,u22TradesUsed:null}; scenario.tradeCounts[team][kind==="dp"?"dpTradesUsed":"u22TradesUsed"]=v; render(); return; }
});
try{var _vt=document.getElementById('vintage'); if(_vt&&DATA_BASE.meta.data_through_display) _vt.textContent='Data through '+DATA_BASE.meta.data_through_display;}catch(e){}

/* ===== global search ===== */
(function(){
  const input=document.getElementById('globalsearch');
  const box=document.getElementById('searchResults');
  if(!input||!box) return;
  const nz=s=>(s||'').toLowerCase();
  const RULES=[['designated player dp','Designated Players'],['u22 initiative young','U22 Initiative'],['international slot','International Slots'],['tam targeted allocation','TAM Player'],['gam general allocation','Allocation Money (GAM)'],['salary budget cap','Salary Budget'],['senior supplemental roster','Roster Construction'],['transfer window freeze','Transfer Windows']];
  function build(q){
    q=nz(q).trim();
    if(q.length<2){ box.hidden=true; box.innerHTML=''; box._r=null; return; }
    const teams=Object.keys(scenario.clubs).filter(t=>nz(t).includes(q)).slice(0,4).map(t=>({type:'team',label:t,team:t}));
    const players=[];
    for(const p of scenario.players){ if(players.length>=6) break; if(nz(p.name).includes(q)) players.push({type:'player',label:p.name,team:p.team}); }
    const rules=RULES.filter(([k])=>k.split(' ').some(w=>w.startsWith(q))||q.length>=3&&k.includes(q)).slice(0,3).map(([k,lab])=>({type:'rule',label:lab}));
    const all=[...teams,...players,...rules];
    box._r=all;
    if(!all.length){ box.innerHTML='<div class="sr-empty">No matches for “'+q+'”</div>'; box.hidden=false; return; }
    box.innerHTML=all.map((r,i)=>'<div class="sr-row" data-sr="'+i+'"><span class="sr-type sr-'+r.type+'">'+r.type+'</span><span class="sr-label">'+r.label+'</span>'+(r.type==='player'?'<span class="sr-sub">'+r.team+'</span>':'')+'</div>').join('');
    box.hidden=false;
  }
  function go(r){
    if(!r) return;
    box.hidden=true; input.value='';
    if(r.type==='rule'){ view='rules'; render(); window.scrollTo(0,0); return; }
    rostersTeam=r.team; view='rosters'; render(); window.scrollTo(0,0);
    if(r.type==='player'){ setTimeout(function(){
      document.querySelectorAll('.rtable .pn').forEach(function(c){
        if(c.textContent===r.label){ const tr=c.closest('tr'); if(tr){ tr.scrollIntoView({block:'center',behavior:'smooth'}); tr.style.transition='background .4s'; tr.style.background='var(--accent-soft)'; setTimeout(function(){tr.style.background='';},1600); } }
      });
    },70); }
  }
  input.addEventListener('input',function(e){ build(e.target.value); });
  input.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); go(box._r&&box._r[0]); } else if(e.key==='Escape'){ box.hidden=true; input.blur(); } });
  box.addEventListener('click',function(e){ const row=e.target.closest('[data-sr]'); if(row&&box._r) go(box._r[+row.dataset.sr]); });
  document.addEventListener('click',function(e){ if(!e.target.closest('.search')) box.hidden=true; });
})();
render();
</script></body></html>
